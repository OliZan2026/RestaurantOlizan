# Configurația de publicare pentru site-ul OLIZAN Restaurant & Pizzeria
# Frontend static + Netlify Functions pentru conturi, comenzi și administrare.

[build]
  # Se publică numai directorul allowlist generat la build. Sursele backend,
  # scripturile, migrațiile, README și fișierele de dezvoltare nu sunt expuse.
  publish = "dist"
  #  1. curăță output-ul și aplică optimizările de performanță;
  #  2. optimizează/validează SEO pentru paginile comerciale;
  #  3. scrie identificatorul publicării în /sw.js;
  #  4. regenerează politica CSP în /_headers;
  #  5. copiază în dist/ numai fișierele care trebuie servite public.
  command = "node scripts/prepare-public.mjs && node scripts/seo-public.mjs && node scripts/pwa-versiune.mjs && node scripts/csp.mjs && node scripts/build-public.mjs"

# --- Domeniul oficial ---------------------------------------------------
# Orice alias public trimite permanent către https://www.restaurantolizan.ro.
[[redirects]]
  from = "https://restaurantolizan.netlify.app/*"
  to = "https://www.restaurantolizan.ro/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://restaurantolizan.netlify.app/*"
  to = "https://www.restaurantolizan.ro/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://restaurantolizan.ro/*"
