name: OLIZAN final validation

on:
  push:
    paths:
      - '.github/workflows/olizan-final-cleanup-v2.yml'

permissions:
  contents: write

jobs:
  validate-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final content cleanup
        run: node scripts/final-cleanup.mjs

      - name: Regenerate and validate CSP
        run: |
          node scripts/csp.mjs
          node scripts/csp.mjs --verifica
          node scripts/csp-test.mjs

      - name: Validate JavaScript, manifest, TOML, SEO and local assets
        shell: bash
        run: |
          for f in assets/js/*.js data/menu.js scripts/*.mjs; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('[manifest] JSON valid')"
          python - <<'PY'
          import tomllib
          with open('netlify.toml', 'rb') as f:
              tomllib.load(f)
          print('[netlify] TOML valid')
          PY
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const htmlFiles = [
            ...fs.readdirSync('.').filter((f) => f.endsWith('.html')),
            ...fs.readdirSync('admin').filter((f) => f.endsWith('.html')).map((f) => 'admin/' + f),
          ];
          const missing = [];
          for (const file of htmlFiles) {
            const html = fs.readFileSync(file, 'utf8');
            for (const match of html.matchAll(/(?:src|href)=["'](\/[^"'?#]+)["']/g)) {
              const url = match[1];
              if (!/^\/(?:assets|data)\//.test(url) && !['/manifest.webmanifest', '/sw.js', '/offline.html'].includes(url)) continue;
              if (!fs.existsSync('.' + url)) missing.push(`${file}: ${url}`);
            }
            if (/rel=["']canonical["'][^>]+href=["'][^"']+\.html(?:["'])/i.test(html)) {
              throw new Error(`Canonical cu .html în ${file}`);
            }
          }
          if (missing.length) throw new Error('Resurse locale lipsă:\n' + missing.join('\n'));
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          if (/https:\/\/www\.restaurantolizan\.ro\/[^<]*\.html/.test(sitemap)) throw new Error('Sitemap conține URL .html');
          const robots = fs.readFileSync('robots.txt', 'utf8');
          if (!robots.includes('Sitemap: https://www.restaurantolizan.ro/sitemap.xml')) throw new Error('Sitemap lipsește din robots.txt');
          console.log(`[static] ${htmlFiles.length} pagini verificate; resurse locale OK`);
          NODE
          git diff --check

      - name: Publish verified cleanup and remove one-time workflows
        shell: bash
        run: |
          rm -f .github/workflows/olizan-final-cleanup.yml .github/workflows/olizan-final-cleanup-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md locatie.html politica-de-confidentialitate.html protectia-datelor-gdpr.html termeni-si-conditii.html sitemap.xml _headers .github/workflows/olizan-final-cleanup.yml .github/workflows/olizan-final-cleanup-v2.yml
          if git diff --cached --quiet; then
            echo "Nicio modificare de publicat."
            exit 0
          fi
          git commit -m "Final audit: curăță și validează producția"
          git push
